# Claude reviews the code, and keeps an eye on vulnerable and outdated crates.
#
# - Every pull request: Claude reviews the change for bugs and security problems and
#   leaves inline comments plus one summary comment. It also gets the `cargo audit` result, so a PR
#   that adds a vulnerable crate is flagged.
# - Every Monday (and by hand from the Actions tab): `cargo audit` and `cargo update --dry-run` run,
#   and Claude keeps one issue, "Dependency report", up to date with what needs attention.
#
# Runs with a Claude subscription (Pro/Max) instead of an API key. Setup, once:
#   1. Install the Claude GitHub App on the repository: https://github.com/apps/claude
#   2. Run `claude setup-token` and add the token it prints as the repository secret
#      CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions > New repository secret).
# (`/install-github-app` in Claude Code does both.) Pull requests from forks are skipped.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

# A new push to a pull request replaces the review still running for the previous one.
concurrency:
  group: claude-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Known vulnerabilities (RustSec) in the crates Cargo.lock pins. Only reads Cargo.lock.
      - name: Audit dependencies
        working-directory: mpc-rv
        run: |
          mkdir -p ../.claude-report
          cargo audit > ../.claude-report/audit.txt 2>&1 || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. It's mpc-rv, a Rust (GTK4 + libmpv) rewrite of MPC-HC; CLAUDE.md
            describes the project and its rules. Read the diff with `gh pr diff`, and open the files it
            touches when you need more context.

            Look for, in this order:
            1. Bugs: wrong behavior, panics (unwrap/expect/indexing on untrusted data), edge cases,
               broken MPC-HC parity, things that stop the app from building or running.
            2. Security: unsafe code, input from files, URLs, playlists, subtitles, the web remote
               (tiny_http) or D-Bus/MPRIS that isn't validated, path traversal, command injection,
               secrets, and over-broad Flatpak permissions in packaging/.
            3. Dependencies: if Cargo.toml or Cargo.lock changed, new or updated crates and whether
               they're needed. .claude-report/audit.txt has the `cargo audit` result for this
               branch; mention any advisory, and say whether this PR introduced it.
            4. Breaks of the rules in CLAUDE.md (e.g. editing mpc-hc-develop/, committing media/).

            Report only real problems, each with a concrete failing case. Skip style nitpicks and
            praise. Put each problem as an inline comment on its line
            (mcp__github_inline_comment__create_inline_comment), then post one short summary with
            `gh pr comment`. If you found nothing, the summary says so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

  dependencies:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Both only read Cargo.toml/Cargo.lock and the crates index; nothing is built or changed.
      - name: Audit and list outdated crates
        working-directory: mpc-rv
        run: |
          mkdir -p ../.claude-report
          cargo audit > ../.claude-report/audit.txt 2>&1 || true
          cargo update --dry-run --verbose > ../.claude-report/outdated.txt 2>&1 || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            Write the weekly dependency report for mpc-rv (a Rust project in mpc-rv/).
            - .claude-report/audit.txt is `cargo audit`: known vulnerabilities and unmaintained or
              yanked crates.
            - .claude-report/outdated.txt is `cargo update --dry-run --verbose`: "Updating" lines are
              updates Cargo.toml already allows (a plain `cargo update`); "Unchanged ... (available:
              ...)" lines are newer major versions that need a Cargo.toml change.
            Read mpc-rv/Cargo.toml to tell direct dependencies from indirect ones.

            The report, in this order: vulnerabilities (crate, advisory ID, severity, fixed version,
            what to do); then outdated direct dependencies (current -> latest, semver-compatible or
            not, and for major updates what may break if you know); then a one-line count of
            outdated indirect crates. Keep it short; say plainly when a section is empty.

            Keep a single open issue titled "Dependency report": find it with
            `gh issue list --state open --search "Dependency report in:title"`. If it exists, replace
            its body with `gh issue edit`; otherwise create it with `gh issue create`. Start the body
            with today's date.
          claude_args: |
            --allowedTools "Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue view:*),Read,Glob,Grep"

# The MPC-RV workspace: the shared core and one app per system. Each folder is its own crate:
#   core/     mpc-core: playlist, settings, commands, mpv set-up (no UI, no platform APIs)
#   linux/    mpc-rv: the Linux app (GTK4)
#   windows/  mpc-rv-windows: the Windows app (Win32)
# `cargo build` / `cargo run` / `cargo test` here cover the core and the Linux app; the Windows app is
# built on Windows with `-p mpc-rv-windows`.
[workspace]
members = ["core", "linux", "windows"]
default-members = ["core", "linux"]
resolver = "3"

[workspace.package]
version = "1.0.6"
edition = "2024"
license = "GPL-3.0-or-later"
